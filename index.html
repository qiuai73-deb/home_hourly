<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国内新闻聚合</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, "Microsoft Yahei", sans-serif;}
        body {background:#f5f7fa; color:#222; padding:20px; max-width:1400px; margin:0 auto;}
        header {background:#fff; border-radius:12px; padding:24px; margin-bottom:20px; box-shadow:0 2px 10px #0000000a;}
        h1 {font-size:26px; margin-bottom:10px; color:#1a365d;}
        .meta-info {color:#666; font-size:14px; line-height:1.8;}
        .source-stats {margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;}
        .tag {background:#e6f0ff; color:#0056b3; padding:4px 10px; border-radius:20px; font-size:13px;}

        /* 顶部综合最新15条区块 */
        .top-latest-block {
            background:#0f2b59;
            border-radius:12px;
            padding:22px;
            margin-bottom:24px;
            color:#fff;
        }
        .top-block-title {
            font-size:20px;
            font-weight:600;
            margin-bottom:16px;
            border-left:5px solid #42a5f5;
            padding-left:12px;
        }
        .top-news-item {
            border-bottom:1px solid rgba(255,255,255,0.15);
            padding:12px 8px;
            cursor:pointer;
            transition:background 0.2s;
        }
        .top-news-item:hover {background:rgba(255,255,255,0.08);}
        .top-cn-title {font-size:16px; font-weight:500; margin-bottom:4px;}
        .top-meta-row {display:flex; gap:16px; font-size:12px; opacity:0.85; flex-wrap:wrap;}

        /* 分媒体板块 */
        .media-block {background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px #00000008;}
        .media-title {font-size:18px; font-weight:600; margin-bottom:14px; color:#112948; border-left:4px solid #0066cc; padding-left:12px;}
        .news-item {border-bottom:1px solid #eee; padding:14px 8px; cursor:pointer; transition:background 0.2s;}
        .news-item:hover {background:#f0f7ff;}
        .cn-title {font-size:16px; font-weight:500; margin-bottom:4px; color:#111;}
        .summary-text {font-size:13px; color:#555; line-height:1.5; margin-top:4px;}
        .pub-time {font-size:12px; color:#888; margin-top:6px;}
        .loading {text-align:center; padding:60px; font-size:18px; color:#555;}
        .error-box {color:#dc2626; text-align:center; padding:60px; font-size:16px; line-height:1.8;}
    </style>
</head>
<body>
    <header>
        <h1>📰 国内新闻聚合</h1>
        <div class="meta-info">
            <div id="update-time">加载中...</div>
            <div id="total-count"></div>
            <div class="source-stats" id="stats-container"></div>
        </div>
    </header>

    <!-- 全媒体混排最新15条 -->
    <section id="top-latest-wrap"></section>

    <!-- 分媒体列表 -->
    <main id="news-container">
        <div class="loading">正在加载新闻数据...</div>
    </main>

    <script>
        async function loadNews() {
            const container = document.getElementById('news-container');
            const topWrap = document.getElementById('top-latest-wrap');
            try {
                const res = await fetch('./news.json');
                if (!res.ok) {
                    container.innerHTML = `<div class="error-box">无法读取新闻数据文件，请等待自动采集完成。</div>`;
                    topWrap.innerHTML = '';
                    return;
                }
                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error-box">采集失败：${data.error}</div>`;
                    topWrap.innerHTML = '';
                    return;
                }

                if (!data || !Array.isArray(data.news) || !data.source_stat) {
                    container.innerHTML = `<div class="error-box">数据格式异常，请检查 crawler.py 是否正常运行。</div>`;
                    topWrap.innerHTML = '';
                    return;
                }

                // 更新顶部信息
                document.getElementById('update-time').innerText = `最后更新：${data.update_cst || '未知'}`;
                document.getElementById('total-count').innerText = `总新闻数：${data.total_count || 0} 条`;
                const statsBox = document.getElementById('stats-container');
                statsBox.innerHTML = '';
                Object.entries(data.source_stat).forEach(([src, cnt]) => {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.innerText = `${src}：${cnt}条`;
                    statsBox.appendChild(tag);
                });

                // ---------- 顶部最新15条 ----------
                topWrap.innerHTML = '';
                const top15 = data.news.slice(0, 15);
                if (top15.length > 0) {
                    const block = document.createElement('div');
                    block.className = 'top-latest-block';
                    block.innerHTML = `<div class="top-block-title">🔥 综合最新15条（按发布时间倒序）</div>`;
                    top15.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'top-news-item';
                        div.innerHTML = `
                            <div class="top-cn-title">${item.title || '（无标题）'}</div>
                            <div class="top-meta-row">
                                <span>来源：${item.source}</span>
                                <span>${item.pub_time || '未知时间'}</span>
                            </div>
                        `;
                        if (item.url) div.onclick = () => window.open(item.url, '_blank');
                        block.appendChild(div);
                    });
                    topWrap.appendChild(block);
                }

                // ---------- 分媒体列表 ----------
                const grouped = {};
                data.news.forEach(item => {
                    if (!grouped[item.source]) grouped[item.source] = [];
                    grouped[item.source].push(item);
                });
                container.innerHTML = '';
                Object.entries(grouped).forEach(([media, items]) => {
                    const block = document.createElement('div');
                    block.className = 'media-block';
                    block.innerHTML = `<div class="media-title">${media}（${items.length}条）</div>`;
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'news-item';
                        div.innerHTML = `
                            <div class="cn-title">${item.title || '（无标题）'}</div>
                            <div class="summary-text">${item.summary ? item.summary.substring(0, 120) + '…' : ''}</div>
                            <div class="pub-time">发布时间：${item.pub_time || '未知时间'}</div>
                        `;
                        if (item.url) div.onclick = () => window.open(item.url, '_blank');
                        block.appendChild(div);
                    });
                    container.appendChild(block);
                });

                if (data.news.length === 0) {
                    container.innerHTML = `<div class="error-box">暂无新闻，等待下一轮采集。</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="error-box">加载失败：${err.message}</div>`;
                topWrap.innerHTML = '';
                console.error(err);
            }
        }

        window.onload = loadNews;
    </script>
</body>
</html>
